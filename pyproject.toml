[project]
name = "trackstuff"
version = "0.3.0"
description = "Track stuff"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "plotext>=5.3.2",
]

[project.scripts]
trackstuff = "trackstuff.cli:cli"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "mypy>=1.17.0",
    "pandas-stubs",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
]

[tool.setuptools]
packages = ["trackstuff"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = [
    "--cov=trackstuff",
    "--cov-report=term-missing",
    "--cov-branch",
]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "plotext"
ignore_missing_imports = true
